# ---------------------------------------------------------------------------
# Configuración de la aplicación
# ---------------------------------------------------------------------------

spring.application.name=act2-t4

# Puerto del servidor embebido (Tomcat).
#   - Por defecto 8080 (pruebas locales).
#   - En el VPS se sobrescribe sin recompilar, por ejemplo:
#         java -jar act2-t4.jar --server.port=8083
#     o con la variable de entorno SERVER_PORT=8083
server.port=${SERVER_PORT:9230}

# Muestra el mensaje de error (p. ej. "No existe la materia con id 99") y los errores de
# validación del DTO en las respuestas de error.
server.error.include-message=always
server.error.include-binding-errors=always

# Thymeleaf: plantillas en src/main/resources/templates/ (valores por defecto, explícitos por claridad).
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# En desarrollo puedes poner THYMELEAF_CACHE=false para ver cambios sin reiniciar.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ---------------------------------------------------------------------------
# Propiedades propias del proyecto
#   - proyecto.nombre / autor / descripcion: ProyectoProperties (@ConfigurationProperties)
#   - proyecto.lema y las anteriores:       VistaGlobalAdvice (@Value) y se muestran en las vistas
# IMPORTANTE: cambia INICIALES y el autor por los tuyos (o define PROYECTO_AUTOR en el entorno).
# ---------------------------------------------------------------------------
proyecto.nombre=SREOactividad2_t4
proyecto.autor=${act2t4:Santiago Erick}
proyecto.descripcion=MVC con Thymeleaf, DTO y parametros - Actividad 2, Tema 4
proyecto.lema=Aprendiendo Spring Boot paso a paso
