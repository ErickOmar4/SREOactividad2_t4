
spring.application.name=SREOactividad2t2_t4


server.port=${SERVER_PORT:9230}

# Muestra el mensaje de error (p. ej. "No existe la materia con id 99") y los errores de
# validación del DTO en las respuestas de error.
server.error.include-message=always
server.error.include-binding-errors=always

# Thymeleaf: plantillas en src/main/resources/templates/ (valores por defecto, explícitos por claridad).
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# En desarrollo puedes poner THYMELEAF_CACHE=false para ver cambios sin reiniciar.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}


proyecto.nombre=SREOactividad2t4
proyecto.autor=${Erick Omar}
proyecto.descripcion=MVC con Thymeleaf, DTO y parametros - Actividad 2, Tema 4
proyecto.lema=Aprendiendo Spring Boot paso a paso
