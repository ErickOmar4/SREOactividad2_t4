<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No encontrado</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="contenedor">
  <span class="etiqueta">Error 404</span>
  <h1>No encontramos lo que buscas</h1>
  <p class="sub" th:text="${message} ?: 'La página o el recurso solicitado no existe.'">Mensaje</p>
  <p><a class="boton" th:href="@{/index.html}">Ir al inicio</a>
     <a class="boton suave" th:href="@{/materias}">Ver materias</a></p>
</main>
</body>
</html>
